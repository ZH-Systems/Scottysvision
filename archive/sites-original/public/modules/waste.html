 function showSaved(r){document.body.dataset.wasteStep='saved';root.innerHTML=`<section class="success panel"><div class="checkmark">✓</div><div class="eyebrow">Entry saved</div><h1>${h(r.itemName)}</h1><p class="saved-amount">${amount(r.qty)} ${h(C.units[r.unit].label)}</p><div class="receipt"><div><span>Ingredient cost</span><strong>${money(r.value)}</strong></div><div><span>Recorded by</span><strong>${h(r.employee)}</strong></div><div><span>Reason</span><strong>${h(r.reason)}</strong></div><div><span>Time</span><strong>${h(C.dateTime(r.at))}</strong></div></div>${r.value===null?'<p class="notice">Quantity saved. Cost is unpriced and needs review.</p>':''}<button class="primary" data-action="another">Log more waste</button><button class="secondary" data-action="records">View records</button></section>`;window.scrollTo(0,0);}
 function records(){view='records';document.body.dataset.wasteStep='records';mainHeader();root.innerHTML=`<div class="intro"><div><div class="eyebrow">Waste records</div><h1>See what’s adding up.</h1><p>Ingredient cost only · CAD · Toronto dates</p></div></div><section class="panel"><div class="filter-row"><div class="field"><label for="from">From</label><input id="from" type="date" value="${C.dateKey(Date.now())}"></div><div class="field"><label for="to">Through</label><input id="to" type="date" value="${C.dateKey(Date.now())}"></div><button class="secondary" data-action="all-records">All dates</button></div><div id="recordContent"></div></section><section class="panel exports"><h2>Export these entries</h2><p>Voided entries are excluded. The full backup retains their audit history.</p><div class="button-grid"><button class="secondary" data-action="export-csv" data-kind="normal">Waste CSV</button><button class="secondary" data-action="export-csv" data-kind="vision">Vision waste CSV</button><button class="secondary" data-action="export-csv" data-kind="inventory">Inventory CSV</button><button class="secondary" data-action="print">Print report</button></div><p class="footnote">Vision exports are drafts. Map ingredient IDs before importing. These files do not change Google Sheets or deduct inventory automatically.</p></section>`;renderRecords();window.scrollTo(0,0);}
 function filtered(){const from=document.getElementById('from')?.value||'',to=document.getElementById('to')?.value||'';return C.currentRecords(state).filter(r=>{const date=C.dateKey(r.at);return(!from||date>=from)&&(!to||date<=to)}).sort((a,b)=>b.at-a.at);}
 function renderRecords(){const list=filtered(),t=C.totals(list);const groups=new Map();for(const r of list){if(!groups.has(r.itemId))groups.set(r.itemId,{name:r.itemName,value:0,unpriced:0,count:0});const g=groups.get(r.itemId);g.value+=r.value??0;g.unpriced+=r.value===null?1:0;g.count++;}document.getElementById('recordContent').innerHTML=`<div class="stats"><div><span>Priced subtotal</span><strong>${money(t.value)}</strong></div><div><span>Entries</span><strong>${t.count}</strong></div><div class="${t.unpriced?'unpriced':''}"><span>Unpriced entries</span><strong>${t.unpriced}</strong></div></div>${t.unpriced?'<p class="notice">The subtotal excludes unpriced entries. Saved entries keep the cost recorded at the time.</p>':''}${list.length?`<details><summary>Totals by ingredient</summary><div class="breakdown">${[...groups.values()].sort((a,b)=>b.value-a.value).map(g=>`<div><span>${h(g.name)}<small>${g.count} entries${g.unpriced?' · '+g.unpriced+' unpriced':''}</small></span><strong>${money(g.value)}${g.unpriced?' + unknown':''}</strong></div>`).join('')}</div></details><div class="record-list">${list.map(r=>`<article class="record"><div class="record-top"><h3>${h(r.itemName)}</h3><strong>${money(r.value)}</strong></div><div class="record-amount">${amount(r.qty)} ${h(C.units[r.unit].label)}</div><p>${h(r.reason)} · ${h(r.employee)}<br>${h(C.dateTime(r.at))}${r.location?'<br>'+h(r.location):''}</p>${r.notes?'<p class="note">'+h(r.notes)+'</p>':''}<small>${h(r.costBasis)}${r.costDate?' · '+h(r.costDate):''} · ${h(r.id)}</small><button class="quiet" data-action="correct" data-id="${h(r.id)}">Correct this entry</button></article>`).join('')}</div>`:'<div class="empty"><h2>No waste entries for these dates.</h2><p>New entries will appear here after you save them.</p></div>'}`;}
 function showModal(html){modal.innerHTML=`<button class="modal-close" data-action="close" aria-label="Close">×</button>${html}<div class="error" role="alert" hidden></div>`;if(!modal.open)modal.showModal();modal.scrollTop=0;}
 function manager(tab=managerTab){managerTab=tab;pendingImport=null;showModal(`<div class="eyebrow">Setup & records</div><h2>Manage waste tracking</h2><nav class="manager-tabs" aria-label="Setup sections">${[['items','Ingredients'],['employees','Employees'],['reasons','Reasons'],['backup','Import & backup']].map(([id,label])=>`<button class="${id===tab?'primary':'secondary'}" data-action="manager-tab" data-id="${id}">${label}</button>`).join('')}</nav><div id="managerBody"></div>`);if(tab==='items')catalog();else if(tab==='employees'||tab==='reasons')people(tab);else backup();}
 function catalog(selected=''){document.getElementById('managerBody').innerHTML=`<p>Shared Vision ingredient list. Imported prices need checking. Use Ingredients → Refresh from Vision Sheets in the main app to read the workbook.</p><div class="field"><label for="catalogSearch">Find an ingredient to edit</label><input id="catalogSearch" type="search" placeholder="Search the list"></div><div class="field"><label for="catalogPick">Ingredient</label><select id="catalogPick"><option value="">Choose an item to review</option>${state.items.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<option value="${h(x.id)}" ${x.id===selected?'selected':''}>${h(x.name)}${!x.active?' · archived':!x.confirmed?' · review price':''}</option>`).join('')}</select></div><button class="secondary" data-action="new-item">+ Add ingredient or prepared item</button><div id="itemEditor"></div>`;if(selected)itemEditor(selected);}
 function itemEditor(id=''){const x=state.items.find(i=>i.id===id)||{id:'',name:'',baseUnit:'g',cost:null,basis:'Current',costDate:'',active:true,confirmed:false,gramsEach:null,mlEach:null,visionId:'',category:'Food',source:'Manual'};document.getElementById('itemEditor').innerHTML=`<form id="itemForm" class="editor" data-id="${h(x.id)}"><h3>${x.id?'Review ingredient':'New ingredient'}</h3><div class="field"><label for="itemName">Name</label><input id="itemName" name="name" value="${h(x.name)}" maxlength="160" required></div><div class="form-row"><div class="field"><label for="baseUnit">Cost unit</label><select id="baseUnit" name="baseUnit">${unitOptions(x.baseUnit)}</select></div><div class="field"><label for="itemCost">Cost per cost unit (CAD)</label><input id="itemCost" name="cost" inputmode="decimal" value="${x.cost??''}" placeholder="Blank = unknown"></div></div><div class="form-row"><div class="field"><label for="basis">Cost basis</label><select id="basis" name="basis">${['Current','Average','Manual','Imported — review'].map(v=>`<option ${v===x.basis?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label for="costDate">Cost checked on</label><input id="costDate" name="costDate" type="date" value="${h(/^\d{4}-\d{2}-\d{2}$/.test(x.costDate||'')?x.costDate:'')}"></div></div><label class="check"><input type="checkbox" name="confirmed" ${x.confirmed?'checked':''}>I checked this price and its unit.</label><label class="check"><input type="checkbox" name="active" ${x.active?'checked':''}>Available in staff dropdown</label><details><summary>Piece conversion & Vision ID (optional)</summary><p>Only enter a measured conversion. Weight and volume are never assumed equivalent.</p><div class="form-row"><div class="field"><label for="gramsEach">Grams per each</label><input id="gramsEach" name="gramsEach" inputmode="decimal" value="${x.gramsEach??''}" placeholder="Unknown"></div><div class="field"><label for="mlEach">mL per each</label><input id="mlEach" name="mlEach" inputmode="decimal" value="${x.mlEach??''}" placeholder="Unknown"></div></div><div class="field"><label for="visionId">Approved Vision ingredient / recipe ID</label><input id="visionId" name="visionId" value="${h(x.visionId)}" maxlength="120" placeholder="Leave blank until mapped"></div><p class="footnote">Source: ${h(x.source)}${x.package?' · package '+h(x.package):''}<br>Local ID: ${h(x.id||'created when saved')}</p></details><div class="error" role="alert" hidden></div><button class="primary" type="submit">Save ingredient</button><p class="footnote">Price updates affect future entries. Existing records keep their original cost.</p></form>`;}
 function people(kind,id=''){const list=state[kind],x=list.find(x=>x.id===id)||{id:'',name:'',active:true},label=kind==='employees'?'employee':'reason';document.getElementById('managerBody').innerHTML=`<p>Edit a name or archive it. Existing waste records retain the original name.</p><div class="people-list">${list.map(p=>`<button class="secondary" data-action="edit-person" data-kind="${kind}" data-id="${h(p.id)}">${h(p.name)}${p.active?'':' · archived'}</button>`).join('')}</div><form id="personForm" class="editor" data-kind="${kind}" data-id="${h(x.id)}"><h3>${x.id?'Edit':'Add'} ${label}</h3><div class="field"><label for="personName">${kind==='employees'?'Employee name':'Waste reason'}</label><input id="personName" name="name" value="${h(x.name)}" maxlength="80" required></div><label class="check"><input type="checkbox" name="active" ${x.active?'checked':''}>Available in staff dropdown</label><div class="error" role="alert" hidden></div><button class="primary" type="submit">Save ${label}</button>${x.id?'<button type="button" class="secondary" data-action="add-person" data-kind="'+kind+'">+ Add another</button>':''}</form>`;}
 function backup(){document.getElementById('managerBody').innerHTML=`<section class="setup-section"><h3>Back up this tablet</h3><p>Download a full backup after each shift. Browser data can be lost if storage is cleared, the device is reset, or the file is moved.</p><button class="primary" data-action="backup">Download full backup</button>${locked?'<button class="secondary" data-action="original">Download unreadable original</button>':''}<p class="footnote">Backup includes employees, ingredients, prices, waste entries and correction history. Keep it on another device.</p></section><section class="setup-section"><h3>Refresh the ingredient list</h3><p>Import a CSV from Vision OS or edit prices here. Existing IDs are updated; unmatched IDs are added. Omitted ingredients are retained. Imported prices require review.</p><button class="secondary" data-action="catalog-template">Download CSV template</button><div class="field"><label for="catalogFile">Ingredient CSV</label><input id="catalogFile" type="file" accept=".csv,text/csv"></div><div id="importPreview"></div><p class="footnote">Required: name, base_unit. Optional: id, cost_per_unit, cost_basis, cost_date, active, grams_per_each, ml_per_each, vision_id. Native 01_INGREDIENTS CSV and the full MASTER INGREDIENTS CSV also work. Use the same IDs when refreshing.</p></section><section class="setup-section"><h3>Restore a full backup</h3><p>Merge missing records. Existing records cannot be overwritten by a conflicting backup. Current ingredient and employee settings are kept when IDs match.</p><div class="field"><label for="backupFile">Waste logger backup (.json)</label><input id="backupFile" type="file" accept=".json,application/json"></div></section><section class="setup-section"><h3>Vision OS</h3><p>Waste and inventory CSV exports match the current Vision column headings. Map approved ingredient IDs before importing. Inventory exports use negative quantities and the waste ID as their reference.</p><p>Entries save locally first. Vision’s Sync screen backs them up privately and offers reviewed Google Sheets posting. Sheets changes require your approval.</p></section>`;}
 function download(name,contents,type='text/plain'){const blob=new Blob([contents],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
 function correct(id){const r=state.records.find(r=>r.id===id);if(!r)return;showModal(`<h2>Correct a waste entry</h2><p>${h(r.itemName)} · ${amount(r.qty)} ${h(C.units[r.unit].label)}<br>${h(C.dateTime(r.at))}</p><p>The original stays in the backup. It will be marked void and excluded from totals. Then log a replacement entry if needed.</p><form id="voidForm" data-id="${h(id)}"><div class="field"><label for="correctBy">Corrected by</label><select id="correctBy" name="by">${options(state.employees,state.settings.lastEmployee,'Choose an employee')}</select></div><div class="field"><label for="correctionReason">Reason for correction</label><textarea id="correctionReason" name="reason" maxlength="500" required></textarea></div><div class="error" role="alert" hidden></div><button class="primary" type="submit">Mark original void</button></form>`);}
 document.addEventListener('submit',event=>{event.preventDefault();const form=event.target;if(!(form instanceof HTMLFormElement))return;const button=event.submitter;try{const f=new FormData(form);
   if(form.id==='wasteForm'){if(document.body.dataset.wasteStep!=='amount'){amountStep();return;}if(button)button.disabled=true;const r=C.makeRecord(Object.fromEntries(f),state.items.find(x=>x.id===f.get('item')),state.employees.find(x=>x.id===f.get('employee')),state.reasons.find(x=>x.id===f.get('reason')));commit(s=>{s.records.push(r);s.settings.lastEmployee=r.employeeId;s.settings.location=r.location;});showSaved(r);}
   else if(form.id==='itemForm'){const id=form.dataset.id||'LOCAL-'+C.uid(),old=state.items.find(x=>x.id===id),cost=C.number(f.get('cost'),true),confirmed=f.has('confirmed'),date=String(f.get('costDate')||'');if(confirmed&&(cost===null||!date||date>C.dateKey(Date.now())))throw Error('A checked cost needs a price and a valid checked-on date, no later than today.');const grams=C.number(f.get('gramsEach'),true),ml=C.number(f.get('mlEach'),true);if(grams===0||ml===0)throw Error('Piece conversions must be greater than zero, or blank.');const item={...(old||{}),id,name:C.text(f.get('name'),'an ingredient name'),baseUnit:f.get('baseUnit'),cost,confirmed,basis:f.get('basis'),costDate:date,active:f.has('active'),gramsEach:grams,mlEach:ml,visionId:String(f.get('visionId')||'').trim(),source:old?.source||'Manual',package:old?.package||''};if(confirmed&&item.basis==='Imported — review')throw Error('Choose Current, Average or Manual after checking the price.');commit(s=>{const i=s.items.findIndex(x=>x.id===id);if(i<0)s.items.push(item);else s.items[i]=item;});catalog(id);toast('Ingredient saved. Earlier waste costs are unchanged.');}
   else if(form.id==='personForm'){const kind=form.dataset.kind,id=form.dataset.id||C.uid(),name=C.text(f.get('name'),'a name',80);if(state[kind].some(x=>x.id!==id&&x.name.toLowerCase()===name.toLowerCase()))throw Error('That name already exists. Edit the existing one.');commit(s=>{const p={id,name,active:f.has('active')},i=s[kind].findIndex(x=>x.id===id);if(i<0)s[kind].push(p);else s[kind][i]=p;});people(kind);toast('List saved.');}
   else if(form.id==='voidForm'){const by=state.employees.find(x=>x.id===f.get('by')&&x.active);if(!by)throw Error('Choose the employee making this correction.');const reason=C.text(f.get('reason'),'a correction reason',500);commit(s=>{if(s.voids.some(v=>v.recordId===form.dataset.id))throw Error('This entry was already voided.');s.voids.push({id:C.uid(),recordId:form.dataset.id,reason,by:by.name,at:Date.now()});});modal.close();records();toast('Original marked void; history retained.');}
 }catch(e){if(button)button.disabled=false;error(form,e);}});
 document.addEventListener('input',event=>{const el=event.target;if(el.id==='ingredientSearch')filterItems(el.value,document.getElementById('ingredient'),document.getElementById('ingredient').value);if(el.id==='catalogSearch'){const pick=document.getElementById('catalogPick'),q=el.value.toLowerCase();pick.innerHTML='<option value="">Choose an item to review</option>'+state.items.filter(x=>x.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<option value="${h(x.id)}">${h(x.name)}${!x.confirmed?' · review price':''}</option>`).join('');}if(el.id==='from'||el.id==='to')renderRecords();});
 document.addEventListener('change',async event=>{const el=event.target;try{if(el.id==='ingredient'){const item=state.items.find(x=>x.id===el.value);if(item)document.getElementById('unit').value=item.baseUnit;preview();}if(el.id==='unit')preview();if(el.id==='catalogPick')itemEditor(el.value);if(el.id==='catalogFile'){const file=el.files[0];if(!file)return;if(file.size>5e6)throw Error('Use an ingredient CSV under 5 MB.');pendingImport=C.importCatalog(await file.text());const matches=pendingImport.filter(x=>state.items.some(y=>y.id===x.id)).length;document.getElementById('importPreview').innerHTML=`<div class="notice">${pendingImport.length} items: ${matches} updates, ${pendingImport.length-matches} additions. Imported prices will need checking. Existing waste records stay unchanged.</div><button class="primary" data-action="confirm-import">Import these ingredients</button>`;}
   if(el.id==='backupFile'){const file=el.files[0];if(!file)return;if(file.size>25e6)throw Error('Use a backup under 25 MB.');const incoming=C.validateStore(JSON.parse(await file.text())),merged=C.mergeBackup(state,incoming),count=merged.records.length-state.records.length;commit(s=>Object.assign(s,merged));manager('backup');toast(count+' missing records restored. Existing settings kept.');}
 }catch(e){error(modal.open?modal:root,e);}});
 document.addEventListener('keydown',e=>{if(e.target.id==='quantity'&&(/^\d$/.test(e.key)||['.',',','Backspace','Delete'].includes(e.key))){e.preventDefault();key(e.key==='Backspace'?'back':e.key==='Delete'?'clear':e.key===','?'.':e.key);}});
 document.addEventListener('click',event=>{const keyEl=event.target.closest('[data-key]');if(keyEl){key(keyEl.dataset.key);return;}const el=event.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;try{
   if(a==='amount-step')amountStep();else if(a==='back-choice')backChoice();else if(a==='log'||a==='another'){if(modal.open)modal.close();log();}else if(a==='records')records();else if(a==='manage')manager();else if(a==='close')modal.close();else if(a==='manager-tab')manager(el.dataset.id);else if(a==='new-item')itemEditor();else if(a==='edit-person')people(el.dataset.kind,el.dataset.id);else if(a==='add-person')people(el.dataset.kind);else if(a==='all-records'){document.getElementById('from').value='';document.getElementById('to').value='';renderRecords();}
   else if(a==='backup')download('Scottys_Waste_Backup_'+C.dateKey(Date.now())+'.json',JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'application/json');
   else if(a==='original')download('Scottys_Waste_Unreadable_Original.json',original,'application/json');
   else if(a==='catalog-template'){download('Scottys_Ingredient_Template.csv',C.csv([['id','name','base_unit','cost_per_unit','cost_basis','cost_date','active','grams_per_each','ml_per_each','vision_id'],['EXAMPLE-ONLY','Example item — replace this row','kg','','Current','','Yes','','','']]),'text/csv;charset=utf-8');}
   else if(a==='confirm-import'){if(!pendingImport)throw Error('Choose a CSV first.');commit(s=>{for(const x of pendingImport){const i=s.items.findIndex(y=>y.id===x.id);if(i<0)s.items.push(x);else s.items[i]={...s.items[i],...x};}});pendingImport=null;manager('items');toast('Ingredient snapshot refreshed. Review prices before costing.');}
   else if(a==='export-csv')download('Scottys_'+(el.dataset.kind==='inventory'?'Inventory_Waste_DRAFT':el.dataset.kind==='vision'?'Vision_Waste_DRAFT':'Waste')+'_'+C.dateKey(Date.now())+'.csv',C.exportCSV(filtered(),el.dataset.kind),'text/csv;charset=utf-8');
   else if(a==='correct')correct(el.dataset.id);else if(a==='print'){const list=filtered(),t=C.totals(list);document.getElementById('printArea').innerHTML=`<h1>Scotty’s on King · Waste report</h1><p>Generated ${h(C.dateTime(Date.now()))} · ${h(document.getElementById('from').value||'all dates')} through ${h(document.getElementById('to').value||'all dates')}<br>Priced subtotal ${money(t.value)} CAD · ${t.unpriced} unpriced entries excluded · ${t.count} entries</p><table><thead><tr>${['Time (Toronto)','Item','Qty','Unit','Reason','Employee','Cost CAD'].map(x=>'<th>'+x+'</th>').join('')}</tr></thead><tbody>${list.map(r=>'<tr>'+[C.dateTime(r.at),r.itemName,amount(r.qty),C.units[r.unit].label,r.reason,r.employee,money(r.value)].map(x=>'<td>'+h(x)+'</td>').join('')+'</tr>').join('')}</tbody></table>`;window.print();}
 }catch(e){error(modal.open?modal:root,e);}});
 modal.addEventListener('close',()=>{const f=document.getElementById('wasteForm');if(!f)return;for(const [field,list] of [['employee','employees'],['reason','reasons']]){const value=f.elements[field].value;f.elements[field].innerHTML=options(state[list],value);}const selected=f.elements.namedItem('item').value;filterItems(document.getElementById('ingredientSearch').value,f.elements.namedItem('item'),selected);preview();});
 log();
})();
</script></body></html>
