 function keypad(key){
   const input=document.getElementById('measurementTemp');if(!input)return;
   let v=input.value;
   if(key==='clear')v='';
   else if(key==='back')v=v.slice(0,-1);
   else if(key==='sign')v=v.startsWith('-')?v.slice(1):'-'+v;
   else if(key==='.') {if(!v.includes('.'))v=(v===''?'0':v==='-'?'-0':v)+'.';}
   else if(/^\d$/.test(key)) {
     if(v.includes('.')&&v.split('.')[1].length>=2)return;
     if(!v.includes('.')&&v.replace('-','').length>=3)return;
     v=(v+key).replace(/^(-?)0+(?=\d)/,'$1');
   }
   input.value=v;
 }

 document.getElementById('manager').addEventListener('click',manager);
 document.getElementById('closeModal').addEventListener('click',()=>modal.close());
 document.getElementById('guidance').addEventListener('click',()=>openModal(`<h2>Temperature rules</h2><div class="numbered-steps"><p><strong>Cook:</strong> verify ≥74°C for 15 seconds in several large wings on each tray. The 20-minute top-oven timer is a reference, not a passing result.</p><p><strong>Cool:</strong> 60°C to 20°C within 2 hours, then to ≤4°C within another 4 hours. This form uses oven-out time as a conservative start. Rack and transfer time count.</p><p><strong>Per-tray deadlines:</strong> ≤20°C by oven-out + 2 h. Then ≤4°C by the earlier of that tray’s first verified ≤20°C time + 4 h, or oven-out + 6 h.</p><p><strong>Keep chilled:</strong> ≤4°C. The suggested 72-hour use-by is a house limit for never-frozen cooked stock, from oven-out.</p></div><div class="notice">Missing or late checks stay on hold. Add actual earlier readings only when supported by a real record; corrections keep the originals.</div><p class="source-links"><a href="https://www.hamilton.ca/sites/default/files/2024-07/Food-Handler-Training-Manual-ENGLISH-APRIL2023.pdf" target="_blank" rel="noopener">Ontario food-handler guide</a><br><a href="https://www.hpph.ca/health-topics/food-and-nutrition/safe-food-handling/" target="_blank" rel="noopener">Huron Perth Public Health</a><br>Guidance checked 4 November 2026.</p>`));
 function beep(){try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=660;g.gain.setValueAtTime(.12,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.6);o.start();o.stop(audioCtx.currentTime+.6);}catch{}}
 function updateSound(){document.getElementById('sound').textContent=data.settings?.sound?'Sound on':'Sound off';}
 document.getElementById('sound').addEventListener('click',()=>{data.settings={...data.settings,sound:!data.settings?.sound};save();updateSound();if(data.settings.sound)beep();});
 const alerted=new Set();let homeSignature='';
 function tick(){const now=Date.now();document.querySelectorAll('[data-countdown]').forEach(el=>el.textContent=timeLeft(Number(el.dataset.countdown),now));
   if(screen==='home'){const sign=data.batches.map(b=>{const e=C.evaluate(b,now);return e.status+':'+(e.nextDue!=null&&e.nextDue<=now);}).join('|');if(homeSignature&&sign!==homeSignature)home();homeSignature=sign;}
   if(selected){const b=batch();if(b){const e=C.evaluate(b,now),el=document.getElementById('liveNotice');if(el)el.innerHTML=notice(e);}}
   if(data.settings?.sound)for(const b of data.batches){const e=C.evaluate(b,now);const key=b.id+':'+e.status+':'+e.nextDue;if((e.nextDue&&now>=e.nextDue||e.status==='review')&&!alerted.has(key)&&!['packed','discarded','cooled'].includes(e.status)){alerted.add(key);beep();}}
 }
 window.addEventListener('beforeunload',e=>{if(!storageOK&&data.batches.length){e.preventDefault();e.returnValue='Download a backup before closing.';}});
 document.addEventListener('visibilitychange',tick);window.addEventListener('focus',tick);
 updateSound();home();setInterval(tick,1000);
})();
</script>
</body></html>
